<!DOCTYPE html>
<html>
<head>
  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"></script>
  
</head>

<body class="p-5">

<div class="text-center">
    <div class="position-relative d-inline-block">
        <img src="images/clarkcowamap.gif" 
        alt="Living Room">

            <!-- Battleground, where we lived-->
            <button type="button"
                class="btn btn-primary position-absolute"
                style="top: 50%; left: 47%"
                data-toggle="popover"
                data-placement="top"
                data-trigger="click"
                title="Where we lived"
                data-content="This is where my wife and I lived for awhile.">
            Battle Ground
            </button>

            <!-- Vancouver, where we got married and bought our first home-->
            <button type="button"
                class="btn btn-primary position-absolute"
                style="top: 78%; left: 25%"
                data-toggle="popover"
                data-placement="top"
                data-trigger="click"
                title="Where so much has happened"
                data-content="This is where we had our wedding, and where we bought our home.">
            Vancouver
            </button>
            
            <!-- Salmon Creek, where I work now-->
            <button type="button"
                class="btn btn-primary position-absolute"
                style="top: 65%; left: 25%"
                data-toggle="popover"
                data-placement="top"
                data-trigger="click"
                title="Where I work now"
                data-content="This is where I work now as a Medical Assistant">
            Salmon Creek
            </button>

            <!-- Mill Plain, where family lives-->
            <button type="button"
                class="btn btn-primary position-absolute"
                style="top: 75%; left: 50%"
                data-toggle="popover"
                data-placement="top"
                data-trigger="click"
                title="Where family lives"
                data-content="This is where my family lives.">
            Mill Plain
            </button>
    </div>
</div>

<script>
$(function () {
  $('[data-toggle="popover"]').popover();
});
</script>


</body>
</html>
